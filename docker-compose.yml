version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "8083:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./admin:/usr/share/nginx/html/admin:ro
      - ./public:/usr/share/nginx/html/public:ro
      - ./menu:/usr/share/nginx/html/menu:ro
    depends_on:
      - backend
      - minio
    networks:
      - menu4d_net
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql://menu4d:menu4d_secret@postgres:5432/menu4d
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=menu4d_admin
      - MINIO_SECRET_KEY=menu4d_secret_key
      - MINIO_BUCKET=menu4d-files
      - JWT_SECRET=change-this-to-a-random-secret-in-production
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - menu4d_net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5436:5432"
    environment:
      - POSTGRES_USER=menu4d
      - POSTGRES_PASSWORD=menu4d_secret
      - POSTGRES_DB=menu4d
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menu4d"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - menu4d_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - menu4d_net
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=menu4d_admin
      - MINIO_ROOT_PASSWORD=menu4d_secret_key
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - menu4d_net
    restart: unless-stopped

networks:
  menu4d_net:
    driver: bridge

volumes:
  pgdata:
  miniodata:
