<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Tenor+Sans&family=Cormorant:ital@1&display=swap" rel="stylesheet" />

  <style>
    :root {
      --primary:   #c9a84c;
      --bg:        #0a0806;
      --text:      #f0e8d8;
      --text-dim:  #9a907e;
      --card:      #1e1a14;
      --border:    #2e2820;
      --surface:   #181410;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Tenor Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ─── Loading ──────────────────────────────── */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-size: 14px;
      color: var(--text-dim);
      letter-spacing: 0.2em;
    }

    /* ─── Hero ─────────────────────────────────── */
    .hero {
      text-align: center;
      padding: 80px 24px 60px;
      border-bottom: 1px solid var(--border);
    }
    .hero-logo {
      max-width: 120px;
      max-height: 80px;
      margin-bottom: 20px;
      border-radius: 8px;
    }
    .hero-name {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(48px, 8vw, 96px);
      line-height: 1;
      color: var(--text);
    }
    .hero-name em { font-style: italic; color: var(--primary); }
    .hero-subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(14px, 2vw, 20px);
      color: var(--text-dim);
      margin-top: 12px;
      letter-spacing: 0.05em;
    }
    .hero-info {
      margin-top: 20px;
      font-size: 12px;
      color: var(--text-dim);
      letter-spacing: 0.1em;
    }

    /* ─── Action Buttons ───────────────────────── */
    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 20px 24px;
      flex-wrap: wrap;
    }
    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 24px;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      background: var(--surface);
      transition: all 0.3s;
      cursor: pointer;
    }
    .action-btn:hover { border-color: var(--primary); color: var(--primary); }
    .action-btn.google { border-color: #fbbc04; color: #fbbc04; }
    .action-btn.whatsapp { border-color: #25d366; color: #25d366; }

    /* ─── Nav Tabs ─────────────────────────────── */
    .nav-wrap {
      position: sticky;
      top: 0;
      z-index: 100;
      background: linear-gradient(to bottom, var(--bg) 80%, transparent);
      padding: 20px 0 0;
    }
    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 0;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 0 24px 20px;
      border-bottom: 1px solid var(--border);
    }
    .nav-tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      font-family: 'Tenor Sans', sans-serif;
      font-size: 11px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      padding: 12px 28px;
      cursor: pointer;
      position: relative;
      white-space: nowrap;
      transition: color 0.3s;
    }
    .tab-btn::after {
      content: '';
      position: absolute;
      bottom: -20px; left: 50%;
      transform: translateX(-50%);
      width: 0; height: 1px;
      background: var(--primary);
      transition: width 0.4s cubic-bezier(0.4,0,0.2,1);
    }
    .tab-btn:hover, .tab-btn.active { color: var(--primary); }
    .tab-btn.active::after { width: 60%; }

    /* ─── Section ──────────────────────────────── */
    .menu-section {
      display: none;
      padding: 60px 5vw 80px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .menu-section.visible { display: block; }
    .section-header {
      text-align: center;
      margin-bottom: 48px;
    }
    .section-eyebrow {
      font-size: 10px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--text-dim);
      display: block;
      margin-bottom: 12px;
    }
    .section-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(36px, 5vw, 60px);
      line-height: 1;
    }
    .section-title em { font-style: italic; color: var(--primary); }

    /* ─── Menu Grid ────────────────────────────── */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2px;
    }

    /* ─── Menu Card ────────────────────────────── */
    .menu-card {
      background: var(--card);
      position: relative;
      overflow: hidden;
      transition: transform 0.5s cubic-bezier(0.4,0,0.2,1);
    }
    .menu-card:hover { transform: scale(1.01); z-index: 2; }
    .menu-card.featured { grid-column: span 2; }
    @media (max-width: 720px) { .menu-card.featured { grid-column: span 1; } }

    .menu-card-img-wrap {
      position: relative;
      aspect-ratio: 4/3;
      overflow: hidden;
    }
    .menu-card.featured .menu-card-img-wrap { aspect-ratio: 16/7; }
    @media (max-width: 720px) { .menu-card.featured .menu-card-img-wrap { aspect-ratio: 4/3; } }

    .menu-card-img-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.8s cubic-bezier(0.4,0,0.2,1);
      filter: brightness(0.85) saturate(0.9);
      cursor: zoom-in;
    }
    .menu-card:hover .menu-card-img-wrap img {
      transform: scale(1.06);
      filter: brightness(0.95) saturate(1.05);
    }
    .menu-card-img-wrap::before {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 50%;
      background: linear-gradient(to top, var(--card) 0%, transparent 100%);
      z-index: 1;
      pointer-events: none;
    }

    .menu-card-body { padding: 20px 24px 28px; }
    .menu-card-category {
      font-size: 9px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .menu-card-name {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400;
      font-size: clamp(22px, 2.5vw, 28px);
      line-height: 1.15;
      color: var(--text);
      margin: 6px 0 10px;
    }
    .menu-card-desc {
      font-size: 13px;
      line-height: 1.7;
      color: var(--text-dim);
      margin-bottom: 18px;
    }
    .menu-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .menu-card-price {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 300;
      color: var(--primary);
    }
    .menu-card-allergens {
      font-size: 10px;
      letter-spacing: 0.15em;
      color: var(--text-dim);
      opacity: 0.6;
    }

    /* ─── AR Badge ─────────────────────────────── */
    .ar-badge {
      position: absolute;
      top: 16px; right: 16px;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0a0806cc;
      border: 1px solid #4ade80;
      border-radius: 20px;
      padding: 5px 12px 5px 8px;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #4ade80;
      backdrop-filter: blur(8px);
      text-decoration: none;
      transition: background 0.3s, box-shadow 0.3s;
    }
    .ar-badge:hover {
      background: #4ade8033;
      box-shadow: 0 0 20px #4ade8033;
    }
    .ar-dot {
      width: 6px; height: 6px;
      background: #4ade80;
      border-radius: 50%;
    }

    /* ─── Image Lightbox ───────────────────────── */
    .img-lightbox-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10, 8, 6, 0.92);
      backdrop-filter: blur(16px);
      z-index: 600;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }
    .img-lightbox-overlay.open { display: flex; }
    .img-lightbox-overlay img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 20px 80px rgba(0,0,0,0.6);
    }

    /* ─── Footer ───────────────────────────────── */
    footer {
      border-top: 1px solid var(--border);
      padding: 48px 24px;
      text-align: center;
    }
    .footer-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 300;
      font-style: italic;
      color: var(--text-dim);
    }
    .footer-text {
      margin-top: 12px;
      font-size: 11px;
      letter-spacing: 0.25em;
      color: var(--text-dim);
      opacity: 0.4;
      text-transform: uppercase;
    }

    /* ─── Responsive ───────────────────────────── */
    @media (max-width: 600px) {
      .menu-grid { grid-template-columns: 1fr; gap: 1px; }
    }

    /* ─── Not Found ────────────────────────────── */
    .not-found {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .not-found h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 48px;
      color: var(--primary);
    }
    .not-found p { color: var(--text-dim); margin-top: 12px; }
  </style>
</head>
<body>
  <div id="app">
    <div class="loading" id="loadingState">Chargement du menu...</div>
  </div>

  <!-- Image Lightbox -->
  <div class="img-lightbox-overlay" id="imgLightbox">
    <img src="" alt="" id="imgLightboxImg" />
  </div>

  <script>
    // Get restaurant slug from URL
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const slug = pathParts[pathParts.length - 1]; // /menu/slug

    async function loadMenu() {
      if (!slug || slug === 'menu') {
        showNotFound();
        return;
      }

      try {
        const res = await fetch(`/api/restaurant/slug/${encodeURIComponent(slug)}`);
        if (!res.ok) {
          showNotFound();
          return;
        }
        const restaurant = await res.json();
        renderMenu(restaurant);
      } catch (err) {
        showNotFound();
      }
    }

    function showNotFound() {
      document.getElementById('app').innerHTML = `
        <div class="not-found">
          <h1>Menu introuvable</h1>
          <p>Ce menu n'existe pas ou a été supprimé.</p>
        </div>
      `;
    }

    function renderMenu(r) {
      // Apply custom colors
      if (r.primaryColor) document.documentElement.style.setProperty('--primary', r.primaryColor);
      if (r.secondaryColor) document.documentElement.style.setProperty('--bg', r.secondaryColor);
      if (r.accentColor) document.documentElement.style.setProperty('--text', r.accentColor);
      document.body.style.backgroundColor = r.secondaryColor || '';
      document.title = `${r.name} — Menu`;

      const categories = r.categories || [];

      // Build action buttons
      let actionsHtml = '';
      if (r.googleReviewUrl || r.whatsappNumber) {
        actionsHtml = '<div class="actions">';
        if (r.googleReviewUrl) {
          actionsHtml += `<a href="${escAttr(r.googleReviewUrl)}" target="_blank" rel="noopener" class="action-btn google">⭐ Laisser un avis</a>`;
        }
        if (r.whatsappNumber) {
          const waUrl = `https://wa.me/${r.whatsappNumber.replace(/[^0-9]/g, '')}?text=${encodeURIComponent('Bonjour, je souhaite faire une réclamation.')}`;
          actionsHtml += `<a href="${escAttr(waUrl)}" target="_blank" rel="noopener" class="action-btn whatsapp">💬 Réclamation</a>`;
        }
        actionsHtml += '</div>';
      }

      // Build nav tabs
      let navHtml = '';
      if (categories.length > 1) {
        navHtml = `<nav class="nav-wrap"><div class="nav-tabs">` +
          categories.map((cat, i) =>
            `<button class="tab-btn ${i === 0 ? 'active' : ''}" data-target="${cat.id}">${escHtml(cat.name)}</button>`
          ).join('') + `</div></nav>`;
      }

      // Build sections
      const sectionsHtml = categories.map((cat, i) => {
        const dishes = cat.dishes || [];
        const dishCards = dishes.map(dish => {
          const img = dish.files?.find(f => f.type === 'IMAGE' || f.type === 'THUMBNAIL');
          const arFile = dish.files?.find(f => f.type === 'USDZ');
          return `
            <div class="menu-card ${dish.featured ? 'featured' : ''}">
              ${img ? `
                <div class="menu-card-img-wrap">
                  <img src="${escAttr(img.url)}" alt="${escAttr(dish.name)}" loading="lazy" onclick="openLightbox(this)" />
                  ${arFile ? `
                    <a class="ar-badge" href="${escAttr(arFile.url)}" rel="ar">
                      <span class="ar-dot"></span>
                      Voir en AR
                    </a>
                  ` : ''}
                </div>
              ` : ''}
              <div class="menu-card-body">
                <p class="menu-card-category">${escHtml(dish.subcategory || '')}</p>
                <h3 class="menu-card-name">${escHtml(dish.name)}</h3>
                ${dish.description ? `<p class="menu-card-desc">${escHtml(dish.description)}</p>` : ''}
                <div class="menu-card-footer">
                  <span class="menu-card-price">${dish.price} €${dish.priceLabel ? ' ' + escHtml(dish.priceLabel) : ''}</span>
                  ${dish.allergens ? `<span class="menu-card-allergens">${escHtml(dish.allergens)}</span>` : ''}
                </div>
              </div>
            </div>
          `;
        }).join('');

        return `
          <section id="sec-${cat.id}" class="menu-section ${i === 0 ? 'visible' : ''}">
            <div class="section-header">
              ${cat.eyebrow ? `<span class="section-eyebrow">${escHtml(cat.eyebrow)}</span>` : ''}
              <h2 class="section-title"><em>${escHtml(cat.name)}</em></h2>
            </div>
            <div class="menu-grid">${dishCards}</div>
          </section>
        `;
      }).join('');

      // Render
      document.getElementById('app').innerHTML = `
        <section class="hero">
          ${r.logoUrl ? `<img class="hero-logo" src="${escAttr(r.logoUrl)}" alt="" />` : ''}
          <h1 class="hero-name"><em>${escHtml(r.name)}</em></h1>
          ${r.subtitle ? `<p class="hero-subtitle">${escHtml(r.subtitle)}</p>` : ''}
          ${r.address || r.phone ? `<p class="hero-info">${escHtml(r.address || '')}${r.address && r.phone ? ' · ' : ''}${escHtml(r.phone || '')}</p>` : ''}
        </section>
        ${actionsHtml}
        ${navHtml}
        ${sectionsHtml}
        <footer>
          <p class="footer-logo">${escHtml(r.name)}</p>
          ${r.address ? `<p class="footer-text">${escHtml(r.address)}</p>` : ''}
        </footer>
      `;

      // Tab navigation
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
          document.querySelectorAll('.menu-section').forEach(s => s.classList.remove('visible'));
          btn.classList.add('active');
          document.getElementById(`sec-${btn.dataset.target}`).classList.add('visible');
        });
      });
    }

    // ─── Lightbox ───────────────────────────────
    function openLightbox(imgEl) {
      const overlay = document.getElementById('imgLightbox');
      const img = document.getElementById('imgLightboxImg');
      img.src = imgEl.src;
      img.alt = imgEl.alt;
      overlay.classList.add('open');
    }

    document.getElementById('imgLightbox').addEventListener('click', () => {
      document.getElementById('imgLightbox').classList.remove('open');
    });

    // ─── Utilities ──────────────────────────────
    function escHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function escAttr(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // ─── Init ───────────────────────────────────
    loadMenu();
  </script>
</body>
</html>
