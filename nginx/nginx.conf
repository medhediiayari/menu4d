worker_processes auto;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # Cache static files aggressively
    map $uri $cache_control {
        ~*\.(jpg|jpeg|png|webp|gif|usdz|obj|glb)$  "public, max-age=31536000, immutable";
        ~*\.(css|js)$                                "public, max-age=86400";
        default                                      "no-cache";
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=5r/s;

    upstream backend {
        server backend:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 100M;

        # API routes
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 8 8k;
        }

        # File uploads
        location /api/upload {
            limit_req zone=upload burst=10 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_request_buffering off;
        }

        # MinIO files (direct serve, bypass backend)
        location /files/ {
            proxy_pass http://minio:9000/menu4d-files/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            add_header Cache-Control $cache_control;
            add_header Access-Control-Allow-Origin *;
            proxy_buffering on;
            proxy_cache_valid 200 24h;
        }

        # Admin panel
        location /admin {
            alias /usr/share/nginx/html/admin;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
        }

        # Dynamic menu pages (per restaurant slug)
        location /menu/ {
            alias /usr/share/nginx/html/menu/;
            index index.html;
            try_files $uri /menu/index.html;
            add_header Cache-Control "no-cache";
        }

        # Public menu
        location / {
            root /usr/share/nginx/html/public;
            index index.html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
