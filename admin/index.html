<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu4D — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <h1>Menu<span>4D</span></h1>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-section="dashboard">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
        <a href="#" class="nav-item" data-section="restaurant">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
          Restaurant
        </a>
        <a href="#" class="nav-item" data-section="categories">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          Catégories
        </a>
        <a href="#" class="nav-item" data-section="dishes">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
          Plats
        </a>
      </nav>
      <div class="sidebar-footer">
        <button id="logoutBtn" class="btn-logout">Déconnexion</button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <header class="topbar">
        <h2 id="pageTitle">Dashboard</h2>
        <div class="topbar-actions">
          <span id="adminEmail" class="admin-email"></span>
        </div>
      </header>

      <div class="content">
        <!-- Dashboard Section -->
        <section id="sec-dashboard" class="section active">
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-number" id="statCategories">0</div>
              <div class="stat-label">Catégories</div>
            </div>
            <div class="stat-card">
              <div class="stat-number" id="statDishes">0</div>
              <div class="stat-label">Plats</div>
            </div>
            <div class="stat-card">
              <div class="stat-number" id="statAR">0</div>
              <div class="stat-label">Fichiers AR</div>
            </div>
            <div class="stat-card">
              <div class="stat-number" id="statImages">0</div>
              <div class="stat-label">Images</div>
            </div>
          </div>
          <div class="quick-actions">
            <button class="btn btn-primary" onclick="navigateTo('dishes')">+ Ajouter un plat</button>
            <button class="btn btn-secondary" onclick="navigateTo('categories')">+ Nouvelle catégorie</button>
            <a href="/" target="_blank" class="btn btn-outline">Voir le menu public ↗</a>
          </div>
        </section>

        <!-- Restaurant Section -->
        <section id="sec-restaurant" class="section">
          <form id="restaurantForm" class="form-card">
            <div class="form-group">
              <label>Nom du restaurant</label>
              <input type="text" name="name" placeholder="La Maison" required />
            </div>
            <div class="form-group">
              <label>Sous-titre</label>
              <input type="text" name="subtitle" placeholder="Une cuisine d'exception..." />
            </div>
            <div class="form-group">
              <label>Adresse</label>
              <input type="text" name="address" placeholder="12 Rue Saint-Honoré, Paris" />
            </div>
            <div class="form-group">
              <label>Téléphone</label>
              <input type="tel" name="phone" placeholder="+33 1 42 00 00 00" />
            </div>
            <button type="submit" class="btn btn-primary">Enregistrer</button>
          </form>
        </section>

        <!-- Categories Section -->
        <section id="sec-categories" class="section">
          <div class="section-toolbar">
            <button class="btn btn-primary" id="addCategoryBtn">+ Nouvelle catégorie</button>
          </div>
          <div id="categoriesList" class="items-list"></div>

          <!-- Category Modal -->
          <div class="modal-overlay" id="categoryModal">
            <div class="modal">
              <h3 id="categoryModalTitle">Nouvelle catégorie</h3>
              <form id="categoryForm">
                <input type="hidden" name="id" />
                <div class="form-group">
                  <label>Nom</label>
                  <input type="text" name="name" placeholder="Entrées" required />
                </div>
                <div class="form-group">
                  <label>Slug (URL)</label>
                  <input type="text" name="slug" placeholder="entrees" required />
                </div>
                <div class="form-group">
                  <label>Sous-titre</label>
                  <input type="text" name="eyebrow" placeholder="Pour commencer" />
                </div>
                <div class="form-group">
                  <label>Ordre</label>
                  <input type="number" name="sortOrder" value="0" />
                </div>
                <div class="modal-actions">
                  <button type="button" class="btn btn-secondary" onclick="closeModal('categoryModal')">Annuler</button>
                  <button type="submit" class="btn btn-primary">Enregistrer</button>
                </div>
              </form>
            </div>
          </div>
        </section>

        <!-- Dishes Section -->
        <section id="sec-dishes" class="section">
          <div class="section-toolbar">
            <select id="filterCategory" class="select-filter">
              <option value="">Toutes les catégories</option>
            </select>
            <button class="btn btn-primary" id="addDishBtn">+ Nouveau plat</button>
          </div>
          <div id="dishesList" class="items-grid"></div>

          <!-- Dish Modal -->
          <div class="modal-overlay" id="dishModal">
            <div class="modal modal-large">
              <h3 id="dishModalTitle">Nouveau plat</h3>
              <form id="dishForm">
                <input type="hidden" name="id" />
                <div class="form-row">
                  <div class="form-group">
                    <label>Nom du plat</label>
                    <input type="text" name="name" placeholder="Tartare de Bœuf" required />
                  </div>
                  <div class="form-group">
                    <label>Prix (€)</label>
                    <input type="number" name="price" step="0.01" placeholder="24.00" required />
                  </div>
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label>Catégorie</label>
                    <select name="categoryId" required id="dishCategorySelect"></select>
                  </div>
                  <div class="form-group">
                    <label>Sous-catégorie</label>
                    <input type="text" name="subcategory" placeholder="Viande, Poisson..." />
                  </div>
                </div>
                <div class="form-group">
                  <label>Description</label>
                  <textarea name="description" rows="3" placeholder="Bœuf haché à la main, câpres, échalotes..."></textarea>
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label>Allergènes</label>
                    <input type="text" name="allergens" placeholder="Œuf · Moutarde" />
                  </div>
                  <div class="form-group">
                    <label>Label prix</label>
                    <input type="text" name="priceLabel" placeholder="/ verre, / personne..." />
                  </div>
                </div>
                <div class="form-row">
                  <div class="form-group checkbox-group">
                    <label><input type="checkbox" name="featured" /> Plat vedette (carte large)</label>
                  </div>
                  <div class="form-group checkbox-group">
                    <label><input type="checkbox" name="visible" checked /> Visible sur le menu</label>
                  </div>
                </div>

                <!-- File uploads -->
                <div class="upload-section">
                  <h4>Fichiers</h4>
                  <div class="upload-grid" id="dishFiles"></div>
                  <div class="upload-dropzone" id="dropzone">
                    <p>Glissez vos fichiers ici ou <label for="fileInput" class="upload-link">parcourir</label></p>
                    <p class="upload-hint">Images (JPG, PNG, WebP) · AR (USDZ) · 3D (OBJ, MTL, GLB, FBX) · Textures</p>
                    <input type="file" id="fileInput" multiple accept=".jpg,.jpeg,.png,.webp,.usdz,.obj,.mtl,.glb,.gltf,.fbx" hidden />
                  </div>
                </div>

                <div class="modal-actions">
                  <button type="button" class="btn btn-secondary" onclick="closeModal('dishModal')">Annuler</button>
                  <button type="submit" class="btn btn-primary">Enregistrer</button>
                </div>
              </form>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
