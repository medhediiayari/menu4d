<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Maison — Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Tenor+Sans&family=Cormorant:ital@1&display=swap" rel="stylesheet" />
  <!-- 3D Viewer: model-viewer for GLB/USDZ -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <!-- 3D Viewer: Three.js for OBJ -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/js/loaders/OBJLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/js/loaders/MTLLoader.js"></script>

  <style>
    :root {
      --black:    #0a0806;
      --deep:     #110e0a;
      --surface:  #181410;
      --card:     #1e1a14;
      --border:   #2e2820;
      --gold:     #c9a84c;
      --gold-dim: #7a6430;
      --gold-glow:#c9a84c44;
      --ivory:    #f0e8d8;
      --ivory-dim:#9a907e;
      --white:    #faf6ef;
      --ar-green: #4ade80;
      --ar-glow:  #4ade8033;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background-color: var(--black);
      color: var(--ivory);
      font-family: 'Tenor Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ─── Grain Overlay ─────────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.028;
      pointer-events: none;
      z-index: 1000;
    }

    /* ─── Loading ──────────────────────────────────── */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      color: var(--gold-dim);
    }

    /* ─── Hero ─────────────────────────────────────── */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 24px;
      overflow: hidden;
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 60% at 50% 40%, #2a1f0a55 0%, transparent 70%),
        radial-gradient(ellipse 40% 50% at 20% 80%, #c9a84c0a 0%, transparent 60%),
        radial-gradient(ellipse 30% 40% at 80% 20%, #c9a84c08 0%, transparent 60%);
    }
    .hero-line-top, .hero-line-bottom {
      position: absolute;
      left: 10%; height: 1px; width: 80%;
      background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
    }
    .hero-line-top { top: 18%; }
    .hero-line-bottom { bottom: 18%; }
    .hero-eyebrow {
      font-size: clamp(10px, 1.2vw, 13px);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .hero-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(64px, 11vw, 140px);
      line-height: 0.9;
      color: var(--white);
      margin: 16px 0 8px;
    }
    .hero-title em { font-style: italic; color: var(--gold); font-weight: 300; }
    .hero-subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(16px, 2.2vw, 22px);
      color: var(--ivory-dim);
      letter-spacing: 0.08em;
    }
    .hero-divider {
      display: flex; align-items: center; gap: 16px; margin: 36px 0;
    }
    .hero-divider span { width: 60px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-dim)); }
    .hero-divider span:last-child { background: linear-gradient(90deg, var(--gold-dim), transparent); }
    .hero-divider-diamond { width: 6px; height: 6px; background: var(--gold); transform: rotate(45deg); }

    /* ─── Nav ──────────────────────────────────────── */
    .nav-wrap {
      position: sticky;
      top: 0;
      z-index: 100;
      background: linear-gradient(to bottom, var(--black) 80%, transparent);
      padding: 20px 0 0;
    }
    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 0;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 0 24px 20px;
      border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      background: none;
      border: none;
      color: var(--ivory-dim);
      font-family: 'Tenor Sans', sans-serif;
      font-size: 11px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      padding: 12px 28px;
      cursor: pointer;
      position: relative;
      white-space: nowrap;
      transition: color 0.3s;
    }
    .tab-btn::after {
      content: '';
      position: absolute;
      bottom: -20px; left: 50%;
      transform: translateX(-50%);
      width: 0; height: 1px;
      background: var(--gold);
      transition: width 0.4s cubic-bezier(0.4,0,0.2,1);
    }
    .tab-btn:hover, .tab-btn.active { color: var(--gold); }
    .tab-btn.active::after { width: 60%; }

    /* ─── Sections ─────────────────────────────────── */
    .menu-section {
      display: none;
      padding: 72px 5vw 100px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .menu-section.visible { display: block; }
    .section-header { text-align: center; margin-bottom: 64px; }
    .section-eyebrow { font-size: 10px; letter-spacing: 0.4em; text-transform: uppercase; color: var(--gold-dim); display: block; margin-bottom: 12px; }
    .section-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(40px, 6vw, 72px);
      color: var(--white);
    }
    .section-title em { font-style: italic; color: var(--gold); }

    /* ─── Grid ─────────────────────────────────────── */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2px;
    }

    /* ─── Card ─────────────────────────────────────── */
    .menu-card {
      background: var(--card);
      position: relative;
      overflow: hidden;
      transition: transform 0.5s cubic-bezier(0.4,0,0.2,1);
    }
    .menu-card:hover { transform: scale(1.01); z-index: 2; }
    .menu-card.featured { grid-column: span 2; }
    @media (max-width: 720px) { .menu-card.featured { grid-column: span 1; } }

    .menu-card-img-wrap {
      position: relative;
      aspect-ratio: 4/3;
      overflow: hidden;
    }
    .menu-card.featured .menu-card-img-wrap { aspect-ratio: 16/7; }
    @media (max-width: 720px) { .menu-card.featured .menu-card-img-wrap { aspect-ratio: 4/3; } }

    .menu-card-img-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.8s cubic-bezier(0.4,0,0.2,1), filter 0.5s;
      filter: brightness(0.85) saturate(0.9);
    }
    .menu-card:hover .menu-card-img-wrap img {
      transform: scale(1.06);
      filter: brightness(0.95) saturate(1.05);
    }
    .menu-card-img-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--gold-glow) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.5s;
      pointer-events: none;
    }
    .menu-card:hover .menu-card-img-wrap::after { opacity: 1; }
    .menu-card-img-wrap::before {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 50%;
      background: linear-gradient(to top, var(--card) 0%, transparent 100%);
      z-index: 1;
      pointer-events: none;
    }

    .menu-card-body { padding: 20px 24px 28px; }
    .menu-card-category { font-size: 9px; letter-spacing: 0.35em; text-transform: uppercase; color: var(--gold-dim); }
    .menu-card-name { font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: clamp(22px, 2.5vw, 28px); color: var(--white); margin: 6px 0 10px; }
    .menu-card-desc { font-size: 13px; line-height: 1.7; color: var(--ivory-dim); margin-bottom: 18px; }
    .menu-card-footer { display: flex; align-items: center; justify-content: space-between; }
    .menu-card-price { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 300; color: var(--gold); }
    .menu-card-allergens { font-size: 10px; letter-spacing: 0.15em; color: var(--ivory-dim); opacity: 0.6; }

    /* ─── 3D/AR Badge ──────────────────────────────── */
    .badge-3d {
      position: absolute;
      top: 16px; right: 16px;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0a0806cc;
      border: 1px solid var(--ar-green);
      border-radius: 20px;
      padding: 5px 12px 5px 8px;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ar-green);
      backdrop-filter: blur(8px);
      cursor: pointer;
      text-decoration: none;
      transition: background 0.3s, box-shadow 0.3s;
      font-family: 'Tenor Sans', sans-serif;
    }
    .badge-3d:hover { background: var(--ar-glow); box-shadow: 0 0 20px var(--ar-glow); }
    .badge-3d-dot { width: 6px; height: 6px; background: var(--ar-green); border-radius: 50%; animation: dotPulse 2s ease-in-out infinite; }
    @keyframes dotPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* ─── 3D Viewer Modal ──────────────────────────── */
    .viewer3d-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #0a0806ee;
      backdrop-filter: blur(12px);
      z-index: 600;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 24px;
    }
    .viewer3d-overlay.open { display: flex; }
    .viewer3d-container {
      width: 90vw;
      height: 70vh;
      max-width: 900px;
      position: relative;
      border: 1px solid var(--border);
      background: #0a0806;
    }
    .viewer3d-container model-viewer {
      width: 100%;
      height: 100%;
    }
    .viewer3d-container canvas { width: 100% !important; height: 100% !important; }
    .viewer3d-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      color: var(--white);
      margin-bottom: 16px;
    }
    .viewer3d-close {
      margin-top: 16px;
      background: none;
      border: 1px solid var(--gold-dim);
      color: var(--gold);
      font-family: 'Tenor Sans', sans-serif;
      font-size: 11px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      padding: 12px 32px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .viewer3d-close:hover { background: var(--gold-glow); }

    .viewer3d-hint {
      font-size: 11px;
      color: var(--ivory-dim);
      margin-top: 8px;
      letter-spacing: 0.1em;
    }

    /* model-viewer custom styles */
    model-viewer {
      --poster-color: #0a0806;
    }
    model-viewer::part(default-ar-button) {
      background: var(--ar-green);
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 12px;
      bottom: 16px;
      right: 16px;
    }

    /* ─── Footer ───────────────────────────────────── */
    footer {
      border-top: 1px solid var(--border);
      padding: 48px 24px;
      text-align: center;
    }
    .footer-logo { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 300; font-style: italic; color: var(--gold-dim); }
    .footer-text { margin-top: 12px; font-size: 11px; letter-spacing: 0.25em; color: var(--ivory-dim); opacity: 0.4; text-transform: uppercase; }

    .no-img-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: var(--surface);
      color: var(--gold-dim);
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
    }

    @media (max-width: 600px) { .menu-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="loading" id="loading">Chargement du menu...</div>

  <div id="menuApp" style="display:none;">
    <!-- Hero -->
    <section class="hero">
      <div class="hero-bg"></div>
      <div class="hero-line-top"></div>
      <p class="hero-eyebrow" id="heroEyebrow"></p>
      <h1 class="hero-title" id="heroTitle"></h1>
      <p class="hero-subtitle" id="heroSubtitle"></p>
      <div class="hero-divider">
        <span></span>
        <div class="hero-divider-diamond"></div>
        <span></span>
      </div>
      <div class="hero-line-bottom"></div>
    </section>

    <!-- Nav -->
    <nav class="nav-wrap">
      <div class="nav-tabs" id="navTabs"></div>
    </nav>

    <!-- Sections -->
    <div id="menuSections"></div>

    <!-- 3D/AR Viewer Modal -->
    <div class="viewer3d-overlay" id="viewer3dModal" onclick="if(event.target===this)close3DViewer()">
      <h3 class="viewer3d-title" id="viewer3dTitle"></h3>
      <div class="viewer3d-container" id="viewer3dContainer"></div>
      <p class="viewer3d-hint" id="viewer3dHint"></p>
      <button class="viewer3d-close" onclick="close3DViewer()">Fermer</button>
    </div>

    <!-- Footer -->
    <footer>
      <p class="footer-logo" id="footerLogo"></p>
      <p class="footer-text" id="footerText"></p>
    </footer>
  </div>

  <script>
    // ─── Load Menu from API (cached by Redis) ────────
    const API = '/api/menu';

    async function loadMenu() {
      try {
        const res = await fetch(API);
        if (!res.ok) throw new Error('Menu indisponible');
        const data = await res.json();
        renderMenu(data);
      } catch (err) {
        document.getElementById('loading').textContent = 'Menu indisponible. Réessayez plus tard.';
      }
    }

    function renderMenu(data) {
      const { restaurant, categories } = data;

      // Hero
      document.getElementById('heroEyebrow').textContent = restaurant.address || '';
      document.getElementById('heroTitle').innerHTML = formatTitle(restaurant.name);
      document.getElementById('heroSubtitle').textContent = restaurant.subtitle || '';

      // Footer
      document.getElementById('footerLogo').textContent = restaurant.name;
      document.getElementById('footerText').textContent = `${restaurant.address || ''} · ${restaurant.phone || ''}`;
      document.title = `${restaurant.name} — Menu`;

      // Nav tabs
      const navTabs = document.getElementById('navTabs');
      navTabs.innerHTML = categories.map((cat, i) =>
        `<button class="tab-btn ${i === 0 ? 'active' : ''}" data-target="${cat.slug}">${escHtml(cat.name)}</button>`
      ).join('');

      // Sections
      const sectionsEl = document.getElementById('menuSections');
      sectionsEl.innerHTML = categories.map((cat, i) => `
        <section id="${cat.slug}" class="menu-section ${i === 0 ? 'visible' : ''}">
          <div class="section-header">
            ${cat.eyebrow ? `<span class="section-eyebrow">${escHtml(cat.eyebrow)}</span>` : ''}
            <h2 class="section-title">${escHtml(cat.name)}</h2>
          </div>
          <div class="menu-grid">
            ${cat.dishes.map(dish => renderDishCard(dish)).join('')}
          </div>
        </section>
      `).join('');

      // Show app, hide loading
      document.getElementById('loading').style.display = 'none';
      document.getElementById('menuApp').style.display = 'block';

      // Tab navigation
      navTabs.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          navTabs.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.menu-section').forEach(s => s.classList.remove('visible'));
          btn.classList.add('active');
          document.getElementById(btn.dataset.target).classList.add('visible');
        });
      });

      // Scroll reveal
      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.style.opacity = '1';
            entry.target.style.transform = 'translateY(0)';
          }
        });
      }, { threshold: 0.08 });

      document.querySelectorAll('.menu-card').forEach((card, i) => {
        card.style.opacity = '0';
        card.style.transform = 'translateY(24px)';
        card.style.transition = `opacity 0.7s ease ${i * 0.05}s, transform 0.7s ease ${i * 0.05}s`;
        observer.observe(card);
      });
    }

    function renderDishCard(dish) {
      const img = dish.files.find(f => f.type === 'IMAGE' || f.type === 'THUMBNAIL');
      const usdzFile = dish.files.find(f => f.type === 'USDZ');
      const objFiles = dish.files.filter(f => f.type === 'OBJ');
      const glbFile = objFiles.find(f => f.url.endsWith('.glb') || f.url.endsWith('.gltf'));
      const objFile = objFiles.find(f => f.url.endsWith('.obj'));
      const has3D = usdzFile || glbFile || objFile;

      // Single unified 3D/AR button
      const badge3d = has3D ? `
        <button class="badge-3d" onclick='open3DViewer(${JSON.stringify({name: dish.name, files: dish.files.filter(f => f.type === "USDZ" || f.type === "OBJ").map(f => ({type: f.type, url: f.url}))}).replace(/'/g, "&#39;")})'>
          <span class="badge-3d-dot"></span>
          3D / AR
        </button>
      ` : '';

      return `
        <div class="menu-card ${dish.featured ? 'featured' : ''}">
          <div class="menu-card-img-wrap">
            ${img ? `<img src="${img.url}" alt="${escAttr(dish.name)}" loading="lazy" />` : `<div class="no-img-placeholder">${escHtml(dish.name)}</div>`}
            ${badge3d}
          </div>
          <div class="menu-card-body">
            ${dish.subcategory ? `<p class="menu-card-category">${escHtml(dish.subcategory)}</p>` : ''}
            <h3 class="menu-card-name">${escHtml(dish.name)}</h3>
            ${dish.description ? `<p class="menu-card-desc">${escHtml(dish.description)}</p>` : ''}
            <div class="menu-card-footer">
              <span class="menu-card-price">${dish.price} €${dish.priceLabel ? ' ' + escHtml(dish.priceLabel) : ''}</span>
              ${dish.allergens ? `<span class="menu-card-allergens">${escHtml(dish.allergens)}</span>` : ''}
            </div>
          </div>
        </div>
      `;
    }

    function formatTitle(name) {
      if (!name) return '';
      const words = name.split(' ');
      if (words.length > 1) {
        return words[0] + ' <em>' + words.slice(1).join(' ') + '</em>';
      }
      return name;
    }

    function handleAR(event, el) {
      // Not used anymore — kept for backward compat
      event.preventDefault();
    }

    // ─── 3D/AR Viewer (unified) ─────────────────────
    let currentRenderer = null;

    function open3DViewer(data) {
      const { name, files } = data;
      document.getElementById('viewer3dTitle').textContent = name;
      document.getElementById('viewer3dModal').classList.add('open');
      const container = document.getElementById('viewer3dContainer');
      const hint = document.getElementById('viewer3dHint');
      container.innerHTML = '<p style="color:var(--ivory-dim);text-align:center;padding:40px;">Chargement du modèle 3D...</p>';

      const usdzFile = files.find(f => f.type === 'USDZ');
      const glbFile = files.find(f => f.url.endsWith('.glb') || f.url.endsWith('.gltf'));
      const objFile = files.find(f => f.url.endsWith('.obj'));
      const mtlFile = files.find(f => f.url.endsWith('.mtl'));

      if (glbFile || usdzFile) {
        // model-viewer: handles iOS AR (USDZ), Android AR (GLB via Scene Viewer), and desktop 3D
        const src = glbFile ? glbFile.url : usdzFile.url;
        container.innerHTML = `
          <model-viewer
            src="${src}"
            ${usdzFile ? `ios-src="${usdzFile.url}"` : ''}
            ar
            ar-modes="webxr scene-viewer quick-look"
            auto-rotate
            camera-controls
            shadow-intensity="1"
            environment-image="neutral"
            style="width:100%;height:100%;background:#0a0806;"
            ar-button-label="Voir en AR"
          >
            <button slot="ar-button" style="
              position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
              background:#4ade80;color:#000;border:none;border-radius:20px;
              padding:10px 24px;font-size:12px;font-weight:600;letter-spacing:0.1em;
              text-transform:uppercase;cursor:pointer;font-family:'Tenor Sans',sans-serif;
            ">
              📱 Voir en AR
            </button>
          </model-viewer>
        `;
        hint.textContent = 'Faites glisser pour tourner · Sur mobile : bouton AR pour voir dans votre espace';
      } else if (objFile) {
        // Three.js for OBJ files
        initOBJViewer(container, objFile.url, mtlFile ? mtlFile.url : null);
        hint.textContent = 'Faites glisser pour tourner le modèle';
      } else {
        container.innerHTML = '<p style="color:var(--ivory-dim);text-align:center;padding:40px;">Aucun modèle 3D compatible trouvé.</p>';
        hint.textContent = '';
      }
    }

    function initOBJViewer(container, objUrl, mtlUrl) {
      container.innerHTML = '';
      const width = container.clientWidth;
      const height = container.clientHeight;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0806);

      const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
      camera.position.set(0, 1, 3);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(width, height);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);
      currentRenderer = renderer;

      // Lights
      const ambient = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambient);
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(2, 3, 4);
      scene.add(dirLight);
      const dirLight2 = new THREE.DirectionalLight(0xc9a84c, 0.3);
      dirLight2.position.set(-2, 1, -2);
      scene.add(dirLight2);

      // Load OBJ
      const loader = new THREE.OBJLoader();

      if (mtlUrl) {
        const mtlLoader = new THREE.MTLLoader();
        mtlLoader.load(mtlUrl, (materials) => {
          materials.preload();
          loader.setMaterials(materials);
          loadObj();
        }, undefined, () => loadObj());
      } else {
        loadObj();
      }

      function loadObj() {
        loader.load(objUrl, (obj) => {
          // Center and scale
          const box = new THREE.Box3().setFromObject(obj);
          const size = box.getSize(new THREE.Vector3());
          const center = box.getCenter(new THREE.Vector3());
          const maxDim = Math.max(size.x, size.y, size.z);
          obj.scale.multiplyScalar(2 / maxDim);
          obj.position.sub(center.multiplyScalar(2 / maxDim));
          scene.add(obj);
        });
      }

      // Simple orbit (mouse drag)
      let isDragging = false;
      let prevMouse = { x: 0, y: 0 };
      let rotation = { x: 0, y: 0 };

      renderer.domElement.addEventListener('mousedown', (e) => { isDragging = true; prevMouse = { x: e.clientX, y: e.clientY }; });
      renderer.domElement.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        rotation.y += (e.clientX - prevMouse.x) * 0.01;
        rotation.x += (e.clientY - prevMouse.y) * 0.01;
        prevMouse = { x: e.clientX, y: e.clientY };
      });
      renderer.domElement.addEventListener('mouseup', () => isDragging = false);
      renderer.domElement.addEventListener('mouseleave', () => isDragging = false);

      // Touch support
      renderer.domElement.addEventListener('touchstart', (e) => { isDragging = true; prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY }; });
      renderer.domElement.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        rotation.y += (e.touches[0].clientX - prevMouse.x) * 0.01;
        rotation.x += (e.touches[0].clientY - prevMouse.y) * 0.01;
        prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      });
      renderer.domElement.addEventListener('touchend', () => isDragging = false);

      function animate() {
        if (!document.getElementById('viewer3dModal').classList.contains('open')) return;
        requestAnimationFrame(animate);
        // Auto-rotate slowly when not dragging
        if (!isDragging) rotation.y += 0.005;
        camera.position.x = 3 * Math.sin(rotation.y) * Math.cos(rotation.x);
        camera.position.y = 3 * Math.sin(rotation.x) + 1;
        camera.position.z = 3 * Math.cos(rotation.y) * Math.cos(rotation.x);
        camera.lookAt(0, 0, 0);
        renderer.render(scene, camera);
      }
      animate();
    }

    function close3DViewer() {
      document.getElementById('viewer3dModal').classList.remove('open');
      document.getElementById('viewer3dContainer').innerHTML = '';
      document.getElementById('viewer3dHint').textContent = '';
      if (currentRenderer) {
        currentRenderer.dispose();
        currentRenderer = null;
      }
    }

    function escHtml(str) {
      if (!str) return '';
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    function escAttr(str) {
      if (!str) return '';
      return str.replace(/"/g, '&quot;').replace(/</g, '&lt;');
    }

    // Load on DOMContentLoaded
    document.addEventListener('DOMContentLoaded', loadMenu);
  </script>
</body>
</html>
